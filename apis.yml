apis:
- name: AWS Security Hub API
  description: >-
    The AWS Security Hub API provides programmatic access to manage centralized
    security findings across your AWS environment. It enables developers to
    import and manage security findings, configure security standards and
    controls, manage integrations with other AWS services and third-party tools,
    and automate security workflows.
