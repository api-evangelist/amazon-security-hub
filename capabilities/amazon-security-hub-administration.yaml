naftiko: 1.0.0-alpha2
info:
  label: Amazon Security Hub — Administration
  description: 'Amazon Security Hub — Administration. 1 operations. Lead operation: Amazon Security Hub Enable Security Hub.
    Self-contained Naftiko capability covering one Amazon Security Hub business surface.'
  tags:
  - Amazon Security Hub
  - Administration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_SECURITY_HUB_API_KEY: AMAZON_SECURITY_HUB_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-security-hub-administration
    baseUri: https://securityhub.amazonaws.com
    description: Amazon Security Hub — Administration business capability. Self-contained, no shared references.
    resources:
    - name: accounts
      path: /accounts
      operations:
      - name: enablesecurityhub
        method: POST
        description: Amazon Security Hub Enable Security Hub
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
  exposes:
  - type: rest
    namespace: amazon-security-hub-administration-rest
    port: 8080
    description: REST adapter for Amazon Security Hub — Administration. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/accounts
      name: accounts
      description: REST surface for accounts.
      operations:
      - method: POST
        name: enablesecurityhub
        description: Amazon Security Hub Enable Security Hub
        call: amazon-security-hub-administration.enablesecurityhub
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-security-hub-administration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Security Hub — Administration. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-security-hub-enable-security
      description: Amazon Security Hub Enable Security Hub
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-security-hub-administration.enablesecurityhub
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
