    description: Amazon Security Hub — Insights business capability. Self-contained, no shared references.
    resources:
    - name: insights
      path: /insights
      operations:
      - name: getinsights
        method: POST
        description: Amazon Security Hub Get Insights
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
