      name: insights
      description: REST surface for insights.
      operations:
      - method: POST
        name: getinsights
        description: Amazon Security Hub Get Insights
        call: amazon-security-hub-insights.getinsights
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
