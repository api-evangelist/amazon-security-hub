naftiko: "1.0.0-alpha1"

info:
  label: "Amazon Security Hub API"
  description: "API for managing security findings, standards, controls, and integrations across AWS accounts for centralized cloud security posture management."
  tags:
    - Amazon Security Hub
    - Security
    - Compliance
    - Monitoring
    - AWS
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: amazon-security-hub
      baseUri: https://securityhub.us-east-1.amazonaws.com
      description: "Amazon Security Hub REST API"
      authentication:
        type: apikey
        key: Authorization
        value: "AWS4-HMAC-SHA256 Credential={{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources:
        - name: findings
          path: /findings
          description: "Security findings management"
          operations:
            - name: get-findings
              method: GET
              description: "Returns a list of findings that match the specified criteria"
              inputParameters:
                - name: Filters
                  in: query
                  type: object
                  required: false
                  description: "Filters to apply to the findings list"
                - name: MaxResults
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of results to return"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: batch-import-findings
              method: POST
              description: "Imports security findings generated by a finding provider"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: batch-update-findings
              method: PATCH
              description: "Updates note and record state of findings"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: standards
          path: /standards/subscriptions
          description: "Security standards management"
          operations:
            - name: get-enabled-standards
              method: GET
              description: "Returns a list of the standards that are currently enabled"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: controls
          path: /standards/controls
          description: "Security controls management"
          operations:
            - name: describe-standards-controls
              method: GET
              description: "Returns a list of security standards controls"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: insights
          path: /insights
          description: "Security insights management"
          operations:
            - name: get-insights
              method: GET
              description: "Lists and describes insights for the specified insight ARNs"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: amazon-security-hub-rest
      resources:
        - path: /v1/findings
          name: findings
          description: "Security findings"
          operations:
            - method: GET
              name: get-findings
              description: "List security findings"
              call: "amazon-security-hub.get-findings"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/standards
          name: standards
          description: "Security standards"
          operations:
            - method: GET
              name: get-enabled-standards
              description: "List enabled security standards"
              call: "amazon-security-hub.get-enabled-standards"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/insights
          name: insights
          description: "Security insights"
          operations:
            - method: GET
              name: get-insights
              description: "List security insights"
              call: "amazon-security-hub.get-insights"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: amazon-security-hub-mcp
      transport: http
      tools:
        - name: get-findings
          description: "Get security findings from Amazon Security Hub"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-security-hub.get-findings"
          outputParameters:
            - type: object
              mapping: "$."
        - name: batch-import-findings
          description: "Import security findings into Amazon Security Hub"
          hints:
            readOnly: false
            idempotent: false
          call: "amazon-security-hub.batch-import-findings"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-enabled-standards
          description: "Get enabled security compliance standards"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-security-hub.get-enabled-standards"
          outputParameters:
            - type: object
              mapping: "$."
        - name: describe-standards-controls
          description: "Get details about security standard controls"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-security-hub.describe-standards-controls"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-insights
          description: "Get security insights and aggregated finding data"
          hints:
            readOnly: true
            idempotent: true
          call: "amazon-security-hub.get-insights"
          outputParameters:
            - type: object
              mapping: "$."
